name: Bug report
description: Report a reproducible problem without personal data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove usernames, local paths, GPU UUIDs, serial numbers and tokens before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: gpu
    attributes:
      label: Sanitized nvidia-smi output
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal paths, identifiers and secrets.
          required: true
